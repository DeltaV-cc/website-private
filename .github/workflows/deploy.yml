name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Repo Pages settings use LEGACY source: branch `gh-pages` / root
# (not GitHub Actions). deploy-pages alone does NOT update the public site.
# This workflow builds main and publishes `out/` to the gh-pages branch.
# Layer 0 scripts may later push only `data/*.json` onto the same branch
# without a full HTML rebuild — that is intentional and OK.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json packageManager field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Version comes from package.json packageManager field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm build already runs prebuild (copy-data + RSS) then next build + patch-basepath
      - run: pnpm build

      # Actual public site = gh-pages branch (legacy Pages source)
      - name: Publish out/ → gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: false
          enable_jekyll: false
          full_commit_message: 'deploy: site from ${{ github.sha }}'
